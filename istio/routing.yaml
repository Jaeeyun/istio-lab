apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: ztna-gateway
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 8080
      name: http
      protocol: HTTP
    hosts:
    - "ztna.local"
    - "employee.company.com"
    - "hr.company.com"
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: ztna-routes
  namespace: istio-system
spec:
  hosts:
  - "ztna.local"
  gateways:
  - ztna-gateway
  http:
  - match:
    - uri: {prefix: /oauth2/}
    route:
    - destination:
        host: oauth2-proxy.oauth2-proxy.svc.cluster.local
        port: {number: 4180}
  - match:
    - uri: {prefix: /realms/}
    - uri: {prefix: /resources/}
    - uri: {prefix: /admin/}
    route:
    - destination:
        host: keycloak.keycloak.svc.cluster.local
        port: {number: 8080}
  - route:
    - destination:
        host: backend.default.svc.cluster.local
        port: {number: 8080}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: step1-oauth2-proxy
  namespace: istio-system
spec:
  selector:
    matchLabels: {istio: ingressgateway}
  action: CUSTOM
  provider:
    name: oauth2-proxy
  rules:
  - to:
    - operation:
        notPaths: ["/oauth2/*", "/realms/*", "/resources/*", "/admin/*"]
# (주의: OPA 체크는 여기 istio-system/ingressgateway에 걸면 안 된다 - "워크로드당
# CUSTOM provider 1개" 제약 때문에 step1(oauth2-proxy)과 충돌한다. 실제 OPA
# 정책은 default 네임스페이스 workload 쪽에 opa-on-backend.yaml로 따로 적용했다.)
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: employee-routes
  namespace: istio-system
spec:
  hosts:
  - "employee.company.com"
  gateways:
  - ztna-gateway
  http:
  - match:
    - uri: {prefix: /oauth2/}
    route:
    - destination:
        host: oauth2-proxy.oauth2-proxy.svc.cluster.local
        port: {number: 4180}
  - route:
    - destination:
        host: employee-page.default.svc.cluster.local
        port: {number: 8080}
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: hr-routes
  namespace: istio-system
spec:
  hosts:
  - "hr.company.com"
  gateways:
  - ztna-gateway
  http:
  - match:
    - uri: {prefix: /oauth2/}
    route:
    - destination:
        host: oauth2-proxy.oauth2-proxy.svc.cluster.local
        port: {number: 4180}
  - route:
    - destination:
        host: hr-page.default.svc.cluster.local
        port: {number: 8080}
