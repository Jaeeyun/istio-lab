apiVersion: v1
kind: ConfigMap
metadata:
  name: device-posture-app
  namespace: device-posture
data:
  app.py: |
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from urllib.parse import urlparse, parse_qs

    DATA_FILE = "/data/posture.json"

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            qs = parse_qs(urlparse(self.path).query)
            user = qs.get("user", [""])[0]
            with open(DATA_FILE) as f:
                data = json.load(f)
            trusted = data.get(user, data.get("_default", True))
            body = json.dumps({"user": user, "trusted": trusted}).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, fmt, *args):
            print("device-posture: " + (fmt % args))

    HTTPServer(("0.0.0.0", 8090), Handler).serve_forever()
  posture.json: |
    {"_default": true}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-posture
  namespace: device-posture
spec:
  replicas: 1
  selector: {matchLabels: {app: device-posture}}
  template:
    metadata:
      labels: {app: device-posture}
    spec:
      initContainers:
      - name: seed-data
        image: busybox:1.36
        command: ["sh", "-c", "cp /config/posture.json /data/posture.json"]
        volumeMounts:
        - {name: config, mountPath: /config}
        - {name: data, mountPath: /data}
      containers:
      - name: app
        image: python:3.12-alpine
        command: ["python3", "/app/app.py"]
        ports: [{containerPort: 8090}]
        volumeMounts:
        - {name: config, mountPath: /app}
        - {name: data, mountPath: /data}
      volumes:
      - name: config
        configMap: {name: device-posture-app}
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: device-posture
  namespace: device-posture
spec:
  selector: {app: device-posture}
  ports: [{port: 8090, targetPort: 8090}]
