# ===================== oauth2-proxy =====================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: oauth2-proxy
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-istio-gateway
  namespace: oauth2-proxy
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: istio-system}
    ports:
    - {protocol: TCP, port: 4180}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns-istiod-and-gateway
  namespace: oauth2-proxy
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: kube-system}
    ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: istio-system}
    ports:
    - {protocol: TCP, port: 15012}
  # oauth2-proxy가 OIDC discovery/token exchange를 할 때도 Keycloak에 직접
  # 붙지 않고 ztna.local:30080(=게이트웨이)을 거치도록 되어 있으므로 egress 대상도
  # keycloak이 아니라 istio-ingressgateway다.
  # 주의: NetworkPolicy의 port는 Service port(30080)가 아니라 DNAT 이후 실제
  # 패킷이 도달하는 파드의 targetPort(8080)를 기준으로 매칭된다.
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: istio-system}
      podSelector:
        matchLabels: {istio: ingressgateway}
    ports:
    - {protocol: TCP, port: 8080}

# ===================== default (backend / 향후 hr·employee 파드) =====================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: default
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-istio-gateway
  namespace: default
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: istio-system}
    ports:
    - {protocol: TCP, port: 8080}
    # employee-page/hr-page(nginx)의 실제 targetPort - Service port(8080)가
    # 아니라 파드가 실제로 듣는 80으로 매칭해야 한다(이미 한 번 겪은 실수).
    - {protocol: TCP, port: 80}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns-istiod-opa-and-gateway
  namespace: default
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: kube-system}
    ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: istio-system}
    ports:
    - {protocol: TCP, port: 15012}
  # backend 파드의 Envoy 사이드카가 OPA에 ext_authz gRPC 체크를 보내는 경로.
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: opa}
      podSelector:
        matchLabels: {app: opa-envoy}
    ports:
    - {protocol: TCP, port: 9191}
  # curltest류 디버그 파드가 브라우저 역할로 ztna.local:30080(게이트웨이)에 직접
  # curl 하는 테스트 경로를 계속 쓸 수 있게 허용.
  # 주의: NetworkPolicy의 port는 Service port(30080)가 아니라 DNAT 이후 실제
  # 패킷이 도달하는 파드의 targetPort(8080)를 기준으로 매칭된다.
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: istio-system}
      podSelector:
        matchLabels: {istio: ingressgateway}
    ports:
    - {protocol: TCP, port: 8080}
